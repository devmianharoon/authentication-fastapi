<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>Privacy checks</title><style>body{font:16px system-ui;max-width:950px;margin:35px auto;padding:20px;background:#f5f7fa;color:#172b4d}button,input,select,textarea{font:inherit;padding:10px;margin:6px 0}textarea,pre{box-sizing:border-box;width:100%}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:white;padding:20px}button{cursor:pointer}</style><p><a href="/docs">Original API docs</a></p>
<form id="login"><label>Username <input id="username" autocomplete="username" required></label><label>Password <input id="password" type="password" autocomplete="current-password" required></label><button>Sign in</button></form>
<h1>Privacy checks</h1><p id="identity">Sign in to evaluate policies.</p>
<p>Consent is saved. Other operations return decisions and proposed plans; edits, erasure, transfers, complaints and notifications are not executed.</p>
<button id="grant">Grant consent</button> <button id="withdraw">Withdraw consent</button>
<p><label>Operation <select id="policy"><option>consent</option><option>lawful</option><option>information</option><option>access</option><option>rectification</option><option>erasure</option><option>restriction</option><option>portability</option><option>objection</option><option>complaint</option><option>breach</option></select></label></p>
<label for="body">Request JSON</label><textarea id="body" rows="7">{}</textarea><button id="evaluate">Evaluate</button>
<pre id="output" role="status">Choose an operation.</pre><script>
let token='';
const examples={rectification:{updates:{name:'Updated Name'}},erasure:{fields:['name'],reason:'withdrawn_consent'},complaint:{authority_id:'cy-0000',description:'Example only'},breach:{incident_id:'example'}};
async function send(operation,value,method='POST'){try{if(!token)throw new Error('Please sign in first');const r=await fetch('/gdpr/'+encodeURIComponent(operation),{method,headers:{'Content-Type':'application/json','Authorization':'Bearer '+token},body:JSON.stringify(value)});output.textContent='HTTP '+r.status+'\n'+JSON.stringify(await r.json(),null,2)}catch(e){output.textContent=e.message}}
const policy=document.querySelector('#policy'),body=document.querySelector('#body'),output=document.querySelector('#output');
policy.onchange=()=>body.value=JSON.stringify(examples[policy.value]||{},null,2);
document.querySelector('#evaluate').onclick=()=>{try{send(policy.value,JSON.parse(body.value))}catch(e){output.textContent=e.message}};
document.querySelector('#grant').onclick=()=>send('consent',{value:'yes',withdrawn:false},'PATCH');
document.querySelector('#withdraw').onclick=()=>send('consent',{value:'yes',withdrawn:true},'PATCH');

document.querySelector('#login').onsubmit=async(e)=>{e.preventDefault();token='';try{const r=await fetch('/login',{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded'},body:new URLSearchParams({username:document.querySelector('#username').value,password:document.querySelector('#password').value})});const data=await r.json();if(!r.ok)throw new Error(data.detail||'Login failed');token=data['access token'];const me=await fetch('/gdpr/profile',{headers:{'Authorization':'Bearer '+token}});const account=await me.json();if(!me.ok){token='';throw new Error('Token validation failed')}document.querySelector('#identity').textContent='Signed in as '+account.userName;output.textContent='Signed in.'}catch(err){output.textContent=err.message}finally{document.querySelector('#password').value=''}};
</script></html>
